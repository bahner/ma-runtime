# NOTE: Do not add a [patch.crates-io] ma-core path override here.
# Runtime releases must build against the published crates.io ma-core 0.13 line.

name: CI / Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: ma
            ext: ""
            test_args: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: ma.exe
            ext: .exe
            test_args: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: ma
            ext: ""
            test_args: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: ma
            ext: ""
            build: cross
            test_args: ""
            rustflags: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: ma
            ext: ""
            build: cross
            test_args: --no-run
            rustflags: "-A linker-messages"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: ma
            ext: ""
            test_args: --no-run

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: Checkout lambda-ma test fixtures
        if: matrix.test_args != '--no-run'
        uses: actions/checkout@v4
        with:
          repository: bahner/lambda-ma
          path: lambda-ma

      - name: Install Linux target dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.build == 'cross'
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install cross --locked
          fi

      - name: Build
        if: matrix.build != 'cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Cross build
        if: matrix.build == 'cross'
        run: cross build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Build lambda-ma scheme actor fixture
        if: matrix.test_args != '--no-run'
        shell: bash
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path lambda-ma/scheme-actor/Cargo.toml --target-dir lambda-ma/scheme-actor/target
          cp lambda-ma/scheme-actor/target/wasm32-unknown-unknown/release/ma_scheme_actor.wasm lambda-ma/scheme-actor/actor.wasm

      - name: Test
        if: matrix.build != 'cross'
        run: cargo test --target ${{ matrix.target }} ${{ matrix.test_args }}
        env:
          LAMBDA_MA_DIR: lambda-ma

      - name: Cross test
        if: matrix.build == 'cross'
        run: cross test --target ${{ matrix.target }} ${{ matrix.test_args }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          LAMBDA_MA_DIR: lambda-ma

      - name: Prepare binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "dist/ma-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ma-${{ matrix.target }}
          path: dist/

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
